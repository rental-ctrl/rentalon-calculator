function modelStep(){const arr=MODELS[state.brand]||[];app.innerHTML=`<div class="card"><div class="title">${state.brand} 희망 차종</div><div class="sub">2026년 국내 판매 라인업을 우선 반영했습니다. 이미지가 확인되지 않은 차종은 잘못된 구형 사진 대신 이미지 없이 표시하며, 목록에 없으면 직접 입력할 수 있습니다.</div><div class="models">${arr.map((m,i)=>{const u=IMG[state.brand]?.[m[0]];return `<button class="model ${state.model===m[0]?'sel':''}" onclick="chooseModel(${i})"><div class="photo">${u?`<img src="${u}" loading="lazy" alt="${m[0]} 실차 사진" onerror="this.style.display='none';this.parentElement.innerHTML='<div style=\'height:100%;display:grid;place-items:center;color:#7b8492;font-size:12px\'>이미지 준비 중</div>'">`:`<div style="height:100%;display:grid;place-items:center;color:#7b8492;font-size:12px">최신 대표 이미지 준비 중</div>`}</div><div class="mtext"><div class="mname">${m[0]}</div><span class="tag">${m[1]}</span></div></button>`}).join('')}<button class="model customModelCard" onclick="directModel()"><div class="photo customPhoto"><span>✎</span></div><div class="mtext"><div class="mname">차종 직접 입력</div><span class="tag">목록에 없는 차량</span></div></button></div><div style="margin-top:16px;font-size:11px;color:#8a93a1">※ 차종명·연식·트림을 알고 있다면 직접 입력할 수 있습니다.</div><div class="actions"><button class="btn secondary" onclick="state.step=1;render()">이전</button></div></div>`}
function chooseModel(i){state.model=MODELS[state.brand][i][0];state.customModel='';state.step=3;render()}
function directModel(){app.innerHTML=`<div class="card"><div class="title">차종 직접 입력</div><div class="sub">목록에 없는 차량도 상담 가능합니다.</div><div class="field"><label>희망 차종 *</label><input id="customModel" value="${state.customModel||''}" placeholder="예: 신형 ○○ 2027년형" autofocus></div><div class="field" style="margin-top:14px"><label>참고사항 (선택)</label><div style="color:#687386;font-size:13px">연식이나 세부 모델을 함께 적어주시면 상담 시 확인하기 쉽습니다.</div></div><div class="actions"><button class="btn secondary" onclick="state.step=2;render()">목록으로</button><button class="btn primary" onclick="saveDirectModel()">이 차량으로 진행</button></div></div>`}
function saveDirectModel(){const v=document.getElementById('customModel').value.trim();if(!v){alert('희망 차종을 입력해주세요.');return}state.customModel=v;state.model=v;state.step=3;render()}
function trimStep(){app.innerHTML=`<div class="card"><div class="title">원하는 트림이 있나요?</div><div class="sub">트림을 몰라도 괜찮습니다. 상담 후 추천받을 수 있습니다.</div><div class="field"><label>희망 트림</label><input id="trim" placeholder="예: 프리미엄 / 익스클루시브 / 캘리그래피" value="${state.trim}"></div><div class="choices" style="margin-top:12px"><button class="choice ${!state.trim?'sel':''}" onclick="setTrim('')">트림을 잘 모르겠어요</button></div><div class="actions"><button class="btn secondary" onclick="state.step=2;render()">이전</button><button class="btn primary" onclick="nextTrim()">다음</button></div></div>`}
function setTrim(v){state.trim=v;render()}function nextTrim(){state.trim=document.getElementById('trim').value.trim();state.step=4;render()}
function conditionStep(){app.innerHTML=`<div class="card"><div class="title">렌탈 조건</div><div class="sub">정확한 견적은 상담을 통해 차량과 조건을 확인한 후 안내합니다.</div><div class="field"><label>계약기간</label><div class="choices">${['36개월','48개월','60개월'].map(x=>`<button class="choice ${state.term===x?'sel':''}" onclick="state.term='${x}';render()">${x}</button>`).join('')}</div></div><div class="field" style="margin-top:18px"><label>연간 주행거리</label><div class="choices">${['10,000 km','20,000 km','30,000 km','40,000 km','50,000 km','무제한 (법인용)'].map(x=>`<button class="choice ${state.mileage===x?'sel':''}" onclick="state.mileage='${x}';render()">${x}</button>`).join('')}</div></div><div class="formgrid" style="margin-top:18px"><div class="field"><label>보증금</label><select id="deposit" onchange="state.deposit=this.value"><option value="0" ${state.deposit==='0'?'selected':''}>0%</option><option value="10" ${state.deposit==='10'?'selected':''}>10%</option><option value="20" ${state.deposit==='20'?'selected':''}>20%</option><option value="30" ${state.deposit==='30'?'selected':''}>30%</option><option value="40" ${state.deposit==='40'?'selected':''}>40%</option><option value="50" ${state.deposit==='50'?'selected':''}>50%</option></select></div><div class="field"><label>선납금</label><select id="prepay" onchange="state.prepay=this.value"><option value="0" ${state.prepay==='0'?'selected':''}>0%</option><option value="10" ${state.prepay==='10'?'selected':''}>10%</option><option value="20" ${state.prepay==='20'?'selected':''}>20%</option><option value="30" ${state.prepay==='30'?'selected':''}>30%</option><option value="40" ${state.prepay==='40'?'selected':''}>40%</option><option value="50" ${state.prepay==='50'?'selected':''}>50%</option></select></div></div><div class="actions"><button class="btn secondary" onclick="state.step=3;render()">이전</button><button class="btn primary" onclick="state.step=5;render()">다음</button></div></div>`}
function contactStep(){app.innerHTML=`<div class="card"><div class="title">상담 신청</div><div class="sub">선택하신 차량과 조건을 확인해주세요.</div><div class="summary"><div class="sum"><small>제조사</small><b>${state.brand}</b></div><div class="sum"><small>차량</small><b>${state.model}</b></div><div class="sum"><small>트림</small><b>${state.trim||'상담 후 결정'}</b></div><div class="sum"><small>계약기간</small><b>${state.term}</b></div><div class="sum"><small>주행거리</small><b>${state.mileage}</b></div><div class="sum"><small>보증금 / 선납금</small><b>${state.deposit}% / ${state.prepay}%</b></div></div><div class="formgrid" style="margin-top:20px"><div class="field"><label>이름 *</label><input id="name" value="${state.name}" placeholder="홍길동"></div><div class="field"><label>휴대폰번호 *</label><input id="phone" value="${state.phone}" placeholder="010-0000-0000" inputmode="tel"></div><div class="field wide"><label>상담 메모 (선택)</label><textarea id="memo" rows="4" placeholder="원하는 색상, 법인/개인, 기타 문의사항">${state.memo}</textarea></div></div><label class="agree"><input id="consent" type="checkbox" ${state.consent?'checked':''}><span>렌탈ON으로부터 차량 및 렌탈 상담을 위한 연락을 받는 것에 동의합니다.</span></label><div class="actions"><button class="btn secondary" onclick="state.step=4;render()">이전</button><button class="btn primary" onclick="submitLead()">상담 신청하기</button></div></div>`}
function submitLead(){state.name=document.getElementById('name').value.trim();state.phone=document.getElementById('phone').value.trim();state.memo=document.getElementById('memo').value.trim();state.consent=document.getElementById('consent').checked;if(!state.name||!state.phone||!state.consent){alert('이름, 휴대폰번호와 상담 연락 동의를 확인해주세요.');return}let leads=JSON.parse(localStorage.getItem('rentalon_leads')||'[]');leads.unshift({id:Date.now(),createdAt:new Date().toLocaleString('ko-KR'),...state,status:'신규'});localStorage.setItem('rentalon_leads',JSON.stringify(leads));app.innerHTML=`<div class="card success"><div class="check">✓</div><div class="title">상담 신청이 완료되었습니다.</div><div class="sub">선택하신 차량을 기준으로 상담원이 확인 후 연락드리겠습니다.</div><button class="btn primary" onclick="goHome()">처음으로</button></div>`}
const ADMIN_PASSWORD='RentalON2026!';
function updateNav(){const adminOpen=document.getElementById('admin').classList.contains('open');document.getElementById('backBtn').style.display=(!adminOpen && state.step>1)?'inline-block':'none';document.getElementById('homeBtn').style.display=adminOpen?'none':'inline-block'}
function goBack(){if(state.step>1){state.step--;render()}}
function goHome(){if(state.step===1){window.scrollTo({top:0,behavior:'smooth'});return;}if(confirm('현재 선택 내용을 처음부터 다시 시작할까요?')){state={step:1,brand:null,model:null,customModel:'',trim:'',term:'48개월',mileage:'20,000 km',deposit:'0',prepay:'0',name:'',phone:'',memo:'',consent:false};render()}}
function openAdminLogin(){document.getElementById('adminModal').classList.add('open');document.getElementById('loginError').classList.remove('show');document.getElementById('adminPassword').value='';setTimeout(()=>document.getElementById('adminPassword').focus(),50)}
function closeAdminLogin(){document.getElementById('adminModal').classList.remove('open')}
function adminLogin(){const p=document.getElementById('adminPassword').value;if(p!==ADMIN_PASSWORD){document.getElementById('loginError').classList.add('show');return}sessionStorage.setItem('rentalon_admin','1');closeAdminLogin();toggleAdmin()}
function toggleAdmin(){if(sessionStorage.getItem('rentalon_admin')!=='1'){openAdminLogin();return}document.getElementById('customer').classList.toggle('hide');document.getElementById('admin').classList.toggle('open');if(document.getElementById('admin').classList.contains('open'))renderAdmin();updateNav()}
function adminLogout(){sessionStorage.removeItem('rentalon_admin');document.getElementById('customer').classList.remove('hide');document.getElementById('admin').classList.remove('open');updateNav()}
function renderAdmin(){let leads=JSON.parse(localStorage.getItem('rentalon_leads')||'[]');let statuses=['전체','신규','연락완료','상담중','견적제출','계약완료','보류/종료'];document.getElementById('adminTabs').innerHTML=statuses.map(s=>`<button class="tab" onclick="filterAdmin('${s}',this)">${s} <b>${s==='전체'?leads.length:leads.filter(x=>x.status===s).length}</b></button>`).join('');drawTable(leads)}
function filterAdmin(s,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');let leads=JSON.parse(localStorage.getItem('rentalon_leads')||'[]');drawTable(s==='전체'?leads:leads.filter(x=>x.status===s))}
function drawTable(leads){if(!leads.length){document.getElementById('adminTable').innerHTML='<div class="empty">아직 상담 신청이 없습니다.</div>';return}document.getElementById('adminTable').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>신청일</th><th>고객</th><th>연락처</th><th>제조사</th><th>차량</th><th>트림</th><th>기간</th><th>주행거리</th><th>보증금</th><th>선납금</th><th>상태</th></tr></thead><tbody>${leads.map(x=>`<tr><td>${x.createdAt}</td><td>${x.name}</td><td>${x.phone}</td><td>${x.brand}</td><td>${x.model}</td><td>${x.trim||'상담 후 결정'}</td><td>${x.term}</td><td>${x.mileage}</td><td>${x.deposit}%</td><td>${x.prepay}%</td><td><select onchange="changeStatus(${x.id},this.value)">${['신규','연락완료','상담중','견적제출','계약완료','보류/종료'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`}
function changeStatus(id,status){let leads=JSON.parse(localStorage.getItem('rentalon_leads')||'[]');let x=leads.find(a=>a.id===id);if(x)x.status=status;localStorage.setItem('rentalon_leads',JSON.stringify(leads));renderAdmin()}
function clearLeads(){if(confirm('현재 브라우저에 저장된 모든 상담 데이터를 삭제할까요?')){localStorage.removeItem('rentalon_leads');renderAdmin()}}
render();

// Navigation is intentionally handled by real buttons and functions; no anchor navigation is used.
document.addEventListener('click', function(e){
  const btn=e.target.closest('button');
  if(!btn) return;
  // Prevent accidental form-style submission behavior on mobile.
  if(btn.type!=='button') btn.type='button';
}, {passive:true});
</script></body></html>
