<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>렌탈ON V26.1</title>
<style>
:root{--navy:#101827;--blue:#2563eb;--line:#e7ebf1;--bg:#f6f8fb;--muted:#6b7280;--green:#0f9f6e}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:var(--bg);color:#111827}button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.topin{max-width:1120px;margin:auto;height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{font-size:22px;font-weight:900;letter-spacing:-.8px}.brand span{color:var(--blue)}.adminBtn{border:1px solid #dfe5ed;background:#fff;border-radius:10px;padding:9px 13px;color:#4b5563}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 70px}.hero{background:linear-gradient(135deg,#101827,#263a5d);color:#fff;border-radius:24px;padding:38px 34px;margin-bottom:22px}.hero h1{margin:0 0 10px;font-size:34px;letter-spacing:-1.5px}.hero p{margin:0;color:#d7dfec}.step{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.pill{padding:7px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);color:#7b8492;font-size:13px}.pill.on{background:#eaf1ff;color:#1d4ed8;border-color:#cbdcff;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 5px 20px rgba(15,23,42,.035)}.title{font-size:23px;font-weight:850;letter-spacing:-.8px;margin-bottom:6px}.sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.brandCard{min-height:112px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transition:.15s}.brandCard:hover,.brandCard.sel{border-color:#8db0ff;box-shadow:0 5px 16px rgba(37,99,235,.1);transform:translateY(-1px)}.logo{height:38px;max-width:105px;object-fit:contain}.brandName{font-size:14px;font-weight:750}.models{grid-template-columns:repeat(3,1fr)}.model{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#fff;text-align:left;padding:0;transition:.15s}.model:hover,.model.sel{border-color:#8db0ff;box-shadow:0 6px 20px rgba(37,99,235,.1)}.photo{height:145px;background:#eef2f7;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo .noimg{height:100%;display:flex;align-items:center;justify-content:center;color:#9aa3b1;font-size:12px}.mtext{padding:14px}.mname{font-size:17px;font-weight:800}.tag{display:inline-block;margin-top:6px;font-size:11px;color:#64748b;background:#f1f5f9;border-radius:999px;padding:4px 7px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:8px}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe4eb;border-radius:11px;padding:12px 13px;background:#fff;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#7ca4ff;box-shadow:0 0 0 3px #eaf1ff}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid #dfe4eb;background:#fff;border-radius:10px;padding:10px 13px}.choice.sel{border-color:#78a1ff;background:#edf4ff;color:#1754c7;font-weight:750}.wide{grid-column:1/-1}.agree{display:flex;gap:9px;align-items:flex-start;margin-top:18px;font-size:13px;color:#4b5563}.agree input{margin-top:3px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid #dfe4eb;color:#4b5563}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sum{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fafbfd}.sum small{display:block;color:#8992a0;font-size:11px;margin-bottom:5px}.sum b{font-size:14px}.success{text-align:center;padding:40px 20px}.check{width:62px;height:62px;border-radius:50%;background:#e8f8f1;color:var(--green);display:grid;place-items:center;margin:0 auto 16px;font-size:30px}
.admin{display:none}.admin.open{display:block}.customer.hide{display:none}.tabs{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px}.tab.on{background:#111827;color:#fff}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:980px}.table th,.table td{padding:12px;border-bottom:1px solid #eef1f5;text-align:left;font-size:12px;white-space:nowrap}.table th{background:#f8fafc;color:#667085}.status{border-radius:999px;padding:4px 8px;background:#f1f5f9}.status.new{background:#eaf1ff;color:#1754c7}.empty{text-align:center;color:#8a93a1;padding:45px}.adminhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.danger{color:#b42318;background:#fff1f0;border:1px solid #ffd6d2;border-radius:9px;padding:8px 11px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.models{grid-template-columns:repeat(2,1fr)}.formgrid,.summary{grid-template-columns:1fr}.hero h1{font-size:27px}.wrap{padding:20px 14px 50px}.hero{padding:28px 22px}.topin{padding:0 14px}}@media(max-width:500px){.models{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.brandCard{min-height:100px}.photo{height:160px}}
</style></head>
<body>
<header class="top"><div class="topin"><div class="brand">렌탈<span>ON</span></div><button class="adminBtn" onclick="toggleAdmin()">관리자</button></div></header>
<main class="wrap">
<section id="customer" class="customer">
<div class="hero"><h1>원하는 차량, 간편하게 상담받으세요</h1><p>제조사와 차량을 선택하고 렌탈 조건을 남겨주시면 전문 상담원이 연락드립니다.</p></div>
<div class="step" id="steps"></div>
<div id="app"></div>
</section>
<section id="admin" class="admin">
<div class="adminhead"><div><div class="title">렌탈ON 상담관리</div><div class="sub">현재 브라우저에 저장된 상담을 관리합니다.</div></div><button class="danger" onclick="clearLeads()">상담 데이터 초기화</button></div>
<div class="tabs" id="adminTabs"></div><div id="adminTable"></div>
</section>
</main>
<script>
const LOGO_BASE='https://cdn.simpleicons.org/';
const BRANDS=[
['현대','Hyundai','hyundai'],['기아','Kia','kia'],['제네시스','Genesis','genesis'],['KGM','KG모빌리티','kgmobility'],['한국GM / 쉐보레','Chevrolet','chevrolet'],['벤츠','Mercedes-Benz','mercedes'],['BMW','BMW','bmw'],['Audi','Audi','audi'],['Volvo','Volvo','volvo'],['Lexus','Lexus','lexus'],['Tesla','Tesla','tesla'],['Volkswagen','Volkswagen','volkswagen'],['Porsche','Porsche','porsche'],['기타','Other','']];
const IMG=(name)=>'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(name)+'?width=1000';
const MODELS={
'현대':[['아반떼','준중형 세단','Hyundai_Avante.jpg'],['쏘나타','중형 세단','Hyundai_Sonata.jpg'],['그랜저','준대형 세단','Hyundai Grandeur.jpg'],['코나','소형 SUV','Hyundai Kona.jpg'],['투싼','준중형 SUV','Hyundai Tucson.jpg'],['싼타페','중형 SUV','Hyundai Santa Fe.jpg'],['팰리세이드','대형 SUV','Hyundai Palisade.jpg'],['스타리아','MPV','Hyundai Staria.jpg'],['아이오닉5','전기 SUV','Hyundai Ioniq 5.jpg'],['아이오닉6','전기 세단','Hyundai Ioniq 6.jpg']],
'기아':[['K3','준중형 세단','Kia K3.jpg'],['K5','중형 세단','Kia K5.jpg'],['K8','준대형 세단','Kia K8.jpg'],['K9','대형 세단','Kia K9.jpg'],['셀토스','소형 SUV','Kia Seltos.jpg'],['스포티지','준중형 SUV','Kia Sportage.jpg'],['쏘렌토','중형 SUV','00 KIA SORENTO HEV 1.jpg'],['카니발','MPV','Kia Carnival.jpg'],['EV3','전기 SUV','Kia EV3.jpg'],['EV6','전기 SUV','Kia EV6.jpg'],['EV9','대형 전기 SUV','Kia EV9.jpg']],
'제네시스':[['G70','스포츠 세단','Genesis G70.jpg'],['G80','준대형 세단','Genesis G80.jpg'],['G90','대형 세단','Genesis G90.jpg'],['GV60','전기 SUV','Genesis GV60.jpg'],['GV70','중형 SUV','Genesis GV70.jpg'],['GV80','대형 SUV','Genesis GV80.jpg'],['GV80 쿠페','럭셔리 SUV 쿠페','Genesis GV80 Coupé (2026) (55209640733).jpg']],
'KGM':[['티볼리','소형 SUV','KGM Tivoli.jpg'],['토레스','중형 SUV','KGM Torres.jpg'],['토레스 EVX','전기 SUV','KGM Torres EVX.jpg'],['렉스턴','대형 SUV','KGM Rexton.jpg'],['렉스턴 스포츠','픽업','KGM Rexton Sports.jpg']],
'한국GM / 쉐보레':[['트랙스 크로스오버','소형 SUV','Chevrolet Trax.jpg'],['트레일블레이저','소형 SUV','Chevrolet Trailblazer.jpg'],['콜로라도','픽업','Chevrolet Colorado.jpg'],['타호','대형 SUV','Chevrolet Tahoe.jpg'],['트래버스','대형 SUV','Chevrolet Traverse.jpg']],
'벤츠':[['A-Class','컴팩트 세단','Mercedes-Benz A-Class.jpg'],['C-Class','중형 세단','Mercedes-Benz C-Class.jpg'],['E-Class','준대형 세단','2024 Mercedes-Benz E-Class E220d AMG Line.jpg'],['S-Class','대형 세단','Mercedes-Benz S-Class.jpg'],['GLC','중형 SUV','Mercedes-Benz GLC.jpg'],['GLE','대형 SUV','Mercedes-Benz GLE.jpg']],
'BMW':[['2 Series','컴팩트','BMW 2 Series.jpg'],['3 Series','중형 세단','BMW 3 Series.jpg'],['5 Series','준대형 세단','BMW G60.jpg'],['7 Series','대형 세단','BMW 7 Series.jpg'],['X3','중형 SUV','BMW X3.jpg'],['X5','대형 SUV','BMW X5.jpg'],['iX','전기 SUV','BMW iX.jpg'],['i5','전기 세단','BMW i5.jpg']],
'Audi':[['A3','컴팩트 세단','Audi A3.jpg'],['A4','중형 세단','Audi A4.jpg'],['A6','준대형 세단','Audi A6.jpg'],['A8','대형 세단','Audi A8.jpg'],['Q3','소형 SUV','Audi Q3.jpg'],['Q5','중형 SUV','Audi Q5.jpg'],['Q7','대형 SUV','Audi Q7.jpg'],['Q8','대형 SUV','Audi Q8.jpg']],
'Volvo':[['S60','중형 세단','Volvo S60.jpg'],['S90','준대형 세단','Volvo S90.jpg'],['XC40','소형 SUV','Volvo XC40.jpg'],['XC60','중형 SUV','Volvo XC60.jpg'],['XC90','대형 SUV','Volvo XC90.jpg'],['EX30','전기 SUV','Volvo EX30.jpg'],['EX40','전기 SUV','Volvo EX40.jpg'],['EX90','대형 전기 SUV','Volvo EX90.jpg']],
'Lexus':[['ES','준대형 세단','Lexus ES.jpg'],['LS','대형 세단','Lexus LS.jpg'],['NX','중형 SUV','Lexus NX.jpg'],['RX','대형 SUV','Lexus RX.jpg'],['LM','럭셔리 MPV','Lexus LM.jpg'],['RZ','전기 SUV','Lexus RZ.jpg']],
'Tesla':[['Model 3','전기 세단','Tesla Model 3.jpg'],['Model Y','전기 SUV','2025 Tesla Model Y Juniper Long Range RWD.jpg'],['Model S','전기 세단','Tesla Model S.jpg'],['Model X','전기 SUV','Tesla Model X.jpg']],
'Volkswagen':[['Golf','해치백','Volkswagen Golf.jpg'],['Passat','중형 세단','Volkswagen Passat.jpg'],['Tiguan','중형 SUV','Volkswagen Tiguan.jpg'],['Touareg','대형 SUV','Volkswagen Touareg.jpg'],['ID.4','전기 SUV','Volkswagen ID.4.jpg'],['ID.7','전기 세단','Volkswagen ID.7.jpg']],
'Porsche':[['718 Cayman','스포츠카','Porsche 718 Cayman.jpg'],['911','스포츠카','Porsche 911.jpg'],['Taycan','전기 스포츠 세단','Porsche Taycan.jpg'],['Macan','중형 SUV','Porsche Macan.jpg'],['Cayenne','대형 SUV','Porsche Cayenne.jpg'],['Panamera','럭셔리 세단','Porsche Panamera.jpg']],
'기타':[['차량명을 직접 입력','상담 요청','']]
};
let state={step:1,brand:null,model:null,trim:'',term:'48개월',mileage:'20,000 km',deposit:0,prepay:0,name:'',phone:'',memo:'',consent:false};
const app=document.getElementById('app');
function steps(){document.getElementById('steps').innerHTML=['제조사','차량','트림','렌탈조건','상담신청'].map((x,i)=>`<span class="pill ${state.step===i+1?'on':''}">${i+1}. ${x}</span>`).join('')}
function render(){steps(); if(state.step===1) brandStep(); else if(state.step===2) modelStep(); else if(state.step===3) trimStep(); else if(state.step===4) conditionStep(); else if(state.step===5) contactStep();}
function brandStep(){app.innerHTML=`<div class="card"><div class="title">어떤 제조사의 차량을 찾으세요?</div><div class="sub">원하는 제조사를 선택해주세요.</div><div class="grid">${BRANDS.map(b=>`<button class="brandCard ${state.brand===b[0]?'sel':''}" onclick="chooseBrand('${b[0]}')">${b[2]?`<img class="logo" src="${LOGO_BASE}${b[2]}" onerror="this.style.display='none'">`:''}<div class="brandName">${b[0]}</div></button>`).join('')}</div></div>`}
function chooseBrand(b){state.brand=b;state.model=null;state.step=2;render()}
function modelStep(){let arr=MODELS[state.brand]||[];app.innerHTML=`<div class="card"><div class="title">${state.brand} 차량을 선택하세요</div><div class="sub">차량을 선택하면 다음 단계에서 트림을 직접 입력할 수 있습니다.</div><div class="grid models">${arr.map((m,i)=>`<button class="model ${state.model===m[0]?'sel':''}" onclick="chooseModel(${i})"><div class="photo">${m[2]?`<img src="${IMG(m[2])}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\'noimg\'>차량 사진을 불러오는 중</div>'">`:`<div class="noimg">차량 사진 준비 중</div>`}</div><div class="mtext"><div class="mname">${m[0]}</div><span class="tag">${m[1]}</span></div></button>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="state.step=1;render()">이전</button></div></div>`}
function chooseModel(i){state.model=MODELS[state.brand][i][0];state.step=3;render()}
function trimStep(){app.innerHTML=`<div class="card"><div class="title">원하는 트림이 있나요?</div><div class="sub">정확히 몰라도 괜찮습니다. 상담 후 추천받을 수 있습니다.</div><div class="field"><label>희망 트림</label><input id="trim" placeholder="예: 프리미엄 / 익스클루시브 / 캘리그래피" value="${state.trim}"></div><div class="choices" style="margin-top:12px"><button class="choice ${!state.trim?'sel':''}" onclick="setTrim('')">트림을 잘 모르겠어요</button></div><div class="actions"><button class="btn secondary" onclick="state.step=2;render()">이전</button><button class="btn primary" onclick="nextTrim()">다음</button></div></div>`}
function setTrim(v){state.trim=v;render()}
function nextTrim(){state.trim=document.getElementById('trim').value.trim();state.step=4;render()}
function conditionStep(){app.innerHTML=`<div class="card"><div class="title">렌탈 조건을 선택하세요</div><div class="sub">월 예산이나 월 렌탈료는 받지 않습니다. 실제 견적은 상담을 통해 안내합니다.</div><div class="field"><label>계약기간</label><div class="choices">${['36개월','48개월','60개월'].map(x=>`<button class="choice ${state.term===x?'sel':''}" onclick="state.term='${x}';render()">${x}</button>`).join('')}</div></div><div class="field" style="margin-top:18px"><label>연간 주행거리</label><div class="choices">${['10,000 km','20,000 km','30,000 km','40,000 km','50,000 km','무제한 (법인용)'].map(x=>`<button class="choice ${state.mileage===x?'sel':''}" onclick="state.mileage='${x}';render()">${x}</button>`).join('')}</div></div><div class="formgrid" style="margin-top:18px"><div class="field"><label>보증금</label><select onchange="state.deposit=this.value"><option value="0">0%</option><option value="10">10%</option><option value="20">20%</option><option value="30">30%</option><option value="40">40%</option><option value="50">50%</option></select></div><div class="field"><label>선납금</label><select onchange="state.prepay=this.value"><option value="0">0%</option><option value="10">10%</option><option value="20">20%</option><option value="30">30%</option><option value="40">40%</option><option value="50">50%</option></select></div></div><div class="actions"><button class="btn secondary" onclick="state.step=3;render()">이전</button><button class="btn primary" onclick="state.step=5;render()">다음</button></div></div>`}
function contactStep(){let trim=state.trim||'상담 후 결정';app.innerHTML=`<div class="card"><div class="title">상담 신청</div><div class="sub">선택하신 차량과 조건을 확인해주세요.</div><div class="summary"><div class="sum"><small>제조사</small><b>${state.brand}</b></div><div class="sum"><small>차량</small><b>${state.model}</b></div><div class="sum"><small>트림</small><b>${trim}</b></div><div class="sum"><small>계약기간</small><b>${state.term}</b></div><div class="sum"><small>주행거리</small><b>${state.mileage}</b></div><div class="sum"><small>보증금 / 선납금</small><b>${state.deposit}% / ${state.prepay}%</b></div></div><div class="formgrid" style="margin-top:20px"><div class="field"><label>이름 *</label><input id="name" value="${state.name}" placeholder="홍길동"></div><div class="field"><label>휴대폰번호 *</label><input id="phone" value="${state.phone}" placeholder="010-0000-0000" inputmode="tel"></div><div class="field wide"><label>상담 메모 (선택)</label><textarea id="memo" rows="4" placeholder="원하는 색상, 법인/개인, 기타 문의사항">${state.memo}</textarea></div></div><label class="agree"><input id="consent" type="checkbox" ${state.consent?'checked':''}> <span>렌탈ON으로부터 차량 및 렌탈 상담을 위한 연락을 받는 것에 동의합니다.</span></label><div class="actions"><button class="btn secondary" onclick="state.step=4;render()">이전</button><button class="btn primary" onclick="submitLead()">상담 신청하기</button></div></div>`}
function submitLead(){state.name=document.getElementById('name').value.trim();state.phone=document.getElementById('phone').value.trim();state.memo=document.getElementById('memo').value.trim();state.consent=document.getElementById('consent').checked;if(!state.name||!state.phone||!state.consent){alert('이름, 휴대폰번호와 상담 연락 동의를 확인해주세요.');return}let leads=JSON.parse(localStorage.getItem('rentalon_leads')||'[]');leads.unshift({id:Date.now(),createdAt:new Date().toLocaleString('ko-KR'),...state,status:'신규'});localStorage.setItem('rentalon_leads',JSON.stringify(leads));app.innerHTML=`<div class="card success"><div class="check">✓</div><div class="title">상담 신청이 완료되었습니다.</div><div class="sub">선택하신 차량을 기준으로 상담원이 확인 후 연락드리겠습니다.</div><button class="btn primary" onclick="location.reload()">처음으로</button></div>`}
function toggleAdmin(){document.getElementById('customer').classList.toggle('hide');document.getElementById('admin').classList.toggle('open');if(document.getElementById('admin').classList.contains('open'))renderAdmin()}
function renderAdmin(){let leads=JSON.parse(localStorage.getItem('rentalon_leads')||'[]');let statuses=['전체','신규','연락완료','상담중','견적제출','계약완료','보류/종료'];document.getElementById('adminTabs').innerHTML=statuses.map(s=>`<button class="tab" onclick="filterAdmin('${s}',this)">${s} <b>${s==='전체'?leads.length:leads.filter(x=>x.status===s).length}</b></button>`).join('');drawTable(leads)}
function filterAdmin(s,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');let leads=JSON.parse(localStorage.getItem('rentalon_leads')||'[]');drawTable(s==='전체'?leads:leads.filter(x=>x.status===s))}
function drawTable(leads){if(!leads.length){document.getElementById('adminTable').innerHTML='<div class="empty">아직 상담 신청이 없습니다.</div>';return}document.getElementById('adminTable').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>신청일</th><th>고객</th><th>연락처</th><th>제조사</th><th>차량</th><th>트림</th><th>기간</th><th>주행거리</th><th>보증금</th><th>선납금</th><th>상태</th></tr></thead><tbody>${leads.map((x,i)=>`<tr><td>${x.createdAt}</td><td>${x.name}</td><td>${x.phone}</td><td>${x.brand}</td><td>${x.model}</td><td>${x.trim||'상담 후 결정'}</td><td>${x.term}</td><td>${x.mileage}</td><td>${x.deposit}%</td><td>${x.prepay}%</td><td><select onchange="changeStatus(${x.id},this.value)">${['신규','연락완료','상담중','견적제출','계약완료','보류/종료'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`}
function changeStatus(id,status){let leads=JSON.parse(localStorage.getItem('rentalon_leads')||'[]');let x=leads.find(a=>a.id===id);if(x)x.status=status;localStorage.setItem('rentalon_leads',JSON.stringify(leads));renderAdmin()}
function clearLeads(){if(confirm('현재 브라우저에 저장된 모든 상담 데이터를 삭제할까요?')){localStorage.removeItem('rentalon_leads');renderAdmin()}}
render();
</script>
</body></html>
